name: Deploy Omar Taha Portfolio

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Update last modified timestamp
        run: |
          # Get current timestamp with exact time in CDT (Central Daylight Time)
          CURRENT_TIMESTAMP=$(TZ='America/Chicago' date '+%B %d, %Y at %I:%M %p %Z')
          
          # Update the timestamp in index.html
          sed -i "s|<span id=\"last-updated-date\">.*</span>|<span id=\"last-updated-date\">$CURRENT_TIMESTAMP</span>|g" index.html
          
          echo "Updated timestamp to: $CURRENT_TIMESTAMP"

      - name: Cache-bust versioned assets
        run: |
          # Cloudflare caches styles.css/script.js for 4h while index.html is
          # served fresh, so a deploy can otherwise pair new HTML with stale JS.
          # Stamping the asset URLs with the commit SHA forces a fresh fetch.
          VERSION="${GITHUB_SHA:0:8}"

          sed -i -E "s|(styles\.css\?v=)[^\"']*|\1$VERSION|g; s|(script\.js\?v=)[^\"']*|\1$VERSION|g" index.html

          echo "Stamped asset URLs with version: $VERSION"
          grep -E "styles\.css\?v=|script\.js\?v=" index.html

      - name: Deploy to server
        run: |
          TARGET=/var/www/omartaha.ca/html
          echo "Deploying to $TARGET"
          rsync -av --exclude='.git*' --exclude='.github' --exclude='logs-server.py' --delete . $TARGET
          echo "Deployment complete"
          ls -la $TARGET | head -20
